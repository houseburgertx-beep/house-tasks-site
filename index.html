  <!-- Runtime Config & Dynamic API Fallback -->
  <script>
    window.__HOUSE_CONFIG__ = null;
    try {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', '/house-tasks-site/app-config.json', false);
      xhr.send(null);
      if (xhr.status === 200) {
        window.__HOUSE_CONFIG__ = JSON.parse(xhr.responseText);
      }
    } catch (e) {
      console.warn('[HOUSE TASKS] Fallback para a configuração padrão');
    }

    if (window.__HOUSE_CONFIG__ && window.__HOUSE_CONFIG__.apiBaseUrl) {
      const configuredApi = window.__HOUSE_CONFIG__.apiBaseUrl.replace(/\/$/, '');
      const defaultApi = 'https://house-tasks-api.brunohouse.workers.dev';
      if (configuredApi !== defaultApi) {
        const _fetch = window.fetch;
        window.fetch = function (url, opts) {
          if (typeof url === 'string' && url.startsWith(defaultApi)) {
            url = url.replace(defaultApi, configuredApi);
          }
          return _fetch.call(this, url, opts);
        };
      }
    }

    if ('serviceWorker' in navigator) {
      const worker = navigator.serviceWorker;
      let hasController = !!worker.controller;
      let updatePending = false;
      let registration;
      const refreshWhenIdle = () => {
        if (!updatePending || document.visibilityState !== 'visible') return;
        if (document.querySelector('dialog[open], [aria-busy="true"], .google-auth-btn:disabled, [data-update-blocked], .auth-loading')) return;
        if (document.activeElement?.matches('input, textarea, select, [contenteditable="true"]')) return;
        updatePending = false;
        location.reload();
      };
      worker.addEventListener('controllerchange', () => {
        if (hasController) {
          updatePending = true;
          refreshWhenIdle();
        }
        hasController = !!worker.controller;
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') registration?.update().catch(() => {});
        refreshWhenIdle();
      });
      window.addEventListener('load', async () => {
        try {
          registration = await worker.register('/house-tasks-site/sw.js', { updateViaCache: 'none' });
          setInterval(() => {
            if (document.visibilityState === 'visible') registration.update().catch(() => {});
          }, 60000);
          setInterval(refreshWhenIdle, 2000);
        } catch (error) {
          console.warn('[HOUSE TASKS] Service Worker indisponível:', error);
        }
      });
    }
  </script>
